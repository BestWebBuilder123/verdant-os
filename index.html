<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b110c">
<title>Verdant OS</title>

<style>
:root {
  --bg: #0b110c;
  --panel: #111912;
  --panel2: #19251b;
  --text: #e0e9df;
  --muted: #8fa08f;
  --accent: #8fbe93;
  --border: #2b3a2c;
  --radius: 15px;
  --blur: 20px;
  --font-size: 14px;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font: var(--font-size)/1.45 system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
}

button, input, textarea, select {
  font: inherit;
}

button {
  color: inherit;
  cursor: pointer;
}

button:focus-visible, input:focus-visible {
  outline: 2px solid var(--accent);
}

button:active {
  transform: scale(.98);
}

.hidden {
  display: none !important;
}

#desktop {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: var(--bg);
}

#wallpaper {
  position: absolute;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse at 15% 20%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 45%),
    radial-gradient(ellipse at 85% 80%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 45%),
    var(--bg);
  background-position: center;
  background-size: cover;
}

#wallpaper::after {
  content: "";
  position: absolute;
  inset: 0;
  background: rgba(0,0,0,var(--overlay,0));
  pointer-events: none;
}

#desktop-content {
  position: absolute;
  inset: 0;
  z-index: 1;
  pointer-events: none;
}

#desktop-content > * {
  pointer-events: auto;
}

.topbar {
  position: absolute;
  top: 12px;
  left: 14px;
  right: 14px;
  height: 44px;
  padding: 0 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
}

.brand {
  font-size: 12px;
  font-weight: 750;
  letter-spacing: .12em;
}

.brand span {
  color: var(--accent);
}

.top-right {
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--muted);
  font-size: 12px;
}

.icon-button {
  border: 1px solid transparent;
  border-radius: 9px;
  padding: 7px 10px;
  background: transparent;
}

.icon-button:hover {
  background: var(--panel2);
  border-color: var(--border);
}

.shortcuts {
  position: absolute;
  left: 16px;
  top: 76px;
  display: grid;
  grid-template-columns: repeat(2, 75px);
  gap: 12px;
}

.shortcut {
  display: grid;
  justify-items: center;
  gap: 7px;
  width: 75px;
  padding: 8px 3px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  font-size: 10px;
  text-shadow: 0 2px 6px #000;
}

.shortcut:hover {
  background: color-mix(in srgb, var(--panel) 80%, transparent);
  border-color: var(--border);
}

.shortcut-icon {
  width: 43px;
  height: 43px;
  display: grid;
  place-items: center;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: var(--panel2);
  color: var(--accent);
  font-size: 21px;
}

#taskbar {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 5px;
  max-width: calc(100vw - 16px);
  overflow-x: auto;
  padding: 7px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
}

.task-button {
  position: relative;
  flex: 0 0 auto;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border: 1px solid transparent;
  border-radius: 11px;
  background: transparent;
  font-size: 20px;
}

.task-button:hover,
.task-button.active {
  background: var(--panel2);
  border-color: var(--border);
}

.task-button.active::after {
  content: "";
  position: absolute;
  bottom: 3px;
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--accent);
}

#start-menu {
  position: absolute;
  bottom: 78px;
  left: 12px;
  width: min(360px, calc(100vw - 24px));
  max-height: 70dvh;
  overflow: auto;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel);
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  box-shadow: 0 20px 70px #0005;
}

#app-search {
  width: 100%;
  margin: 10px 0;
}

#app-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 6px;
}

.app-tile {
  display: grid;
  justify-items: center;
  gap: 7px;
  padding: 12px 3px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  font-size: 11px;
}

.app-tile:hover {
  border-color: var(--border);
  background: var(--panel2);
}

.app-tile span {
  font-size: 24px;
  color: var(--accent);
}

#windows {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.window {
  position: absolute;
  left: 50%;
  top: 50%;
  width: min(680px, calc(100vw - 24px));
  height: min(520px, calc(100dvh - 110px));
  min-width: 0;
  min-height: 230px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  pointer-events: auto;
  transform: translate(-50%, -50%);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  color: var(--text);
  box-shadow: 0 25px 90px #0006;
  backdrop-filter: blur(var(--blur));
  -webkit-backdrop-filter: blur(var(--blur));
  animation: appear .18s ease-out;
}

@keyframes appear {
  from { opacity: 0; }
  to { opacity: 1; }
}

.window.maximized {
  left: 8px !important;
  top: 60px !important;
  width: calc(100vw - 16px) !important;
  height: calc(100dvh - 118px) !important;
  transform: none !important;
}

.window.minimized {
  display: none;
}

.titlebar {
  flex: 0 0 44px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px 0 14px;
  border-bottom: 1px solid var(--border);
  background: var(--panel2);
  cursor: grab;
  user-select: none;
  touch-action: none;
}

.titlebar:active {
  cursor: grabbing;
}

.window-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 12px;
  font-weight: 650;
}

.window-controls {
  display: flex;
  gap: 4px;
}

.window-controls button {
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 7px;
  background: transparent;
}

.window-controls button:hover {
  background: var(--bg);
}

.window-controls .close:hover {
  background: #8d403d;
}

.window-body {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 18px;
}

h1, h2, h3, p {
  margin-top: 0;
}

h2 {
  font-size: 23px;
  font-weight: 600;
  letter-spacing: -.04em;
}

.muted {
  color: var(--muted);
  font-size: 12px;
}

.panel {
  padding: 14px;
  margin: 10px 0;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--panel2);
}

button.primary, button.secondary {
  padding: 9px 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--panel2);
}

button.primary {
  color: var(--text);
  border-color: var(--accent);
}

input, textarea, select {
  min-width: 0;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--bg);
  color: var(--text);
}

input[type="color"] {
  width: 46px;
  height: 36px;
  padding: 3px;
}

input[type="range"] {
  width: min(180px, 45%);
  accent-color: var(--accent);
}

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
}

.setting-row:last-child {
  border-bottom: 0;
}

.setting-row strong {
  display: block;
  font-size: 12px;
}

.setting-row small {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 11px;
}

.theme-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.theme-option {
  padding: 10px;
  text-align: left;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel2);
}

.theme-option.selected {
  border-color: var(--accent);
}

.theme-preview {
  display: flex;
  height: 26px;
  gap: 4px;
  margin-bottom: 8px;
}

.theme-preview span {
  flex: 1;
  border-radius: 5px;
}

.toggle {
  width: 38px;
  height: 22px;
  padding: 3px;
  border: 0;
  border-radius: 20px;
  background: var(--border);
}

.toggle span {
  display: block;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: var(--muted);
  transition: transform .15s;
}

.toggle.on {
  background: var(--accent);
}

.toggle.on span {
  background: var(--bg);
  transform: translateX(16px);
}

#toast {
  position: absolute;
  z-index: 9999;
  top: 68px;
  left: 50%;
  transform: translateX(-50%);
  max-width: calc(100vw - 24px);
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  box-shadow: 0 8px 30px #0005;
}

body.no-animations *,
body.no-animations *::before,
body.no-animations *::after {
  animation: none !important;
  transition: none !important;
}

body.square-windows .window,
body.square-windows .topbar,
body.square-windows #taskbar,
body.square-windows #start-menu,
body.square-windows .panel,
body.square-windows button {
  border-radius: 3px;
}

@media (max-width: 600px) {
  .topbar {
    top: 7px;
    left: 7px;
    right: 7px;
    height: 40px;
    padding: 0 9px;
  }

  .top-right {
    gap: 3px;
  }

  .shortcuts {
    top: 58px;
    left: 5px;
    grid-template-columns: repeat(2, 60px);
    gap: 5px;
  }

  .shortcut {
    width: 60px;
    font-size: 9px;
  }

  .shortcut-icon {
    width: 36px;
    height: 36px;
  }

  #taskbar {
    bottom: 5px;
    padding: 5px;
    gap: 2px;
  }

  .task-button {
    width: 35px;
    height: 37px;
    font-size: 17px;
  }

  .window {
    left: 6px;
    top: 50px;
    width: calc(100vw - 12px);
    height: calc(100dvh - 100px);
    min-height: 220px;
    transform: none;
  }

  .window.maximized {
    left: 4px !important;
    top: 46px !important;
    width: calc(100vw - 8px) !important;
    height: calc(100dvh - 92px) !important;
  }

  .window-body {
    padding: 13px;
  }

  h2 {
    font-size: 21px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>
<div id="desktop">
  <div id="wallpaper"></div>

  <div id="desktop-content">
    <header class="topbar">
      <div class="brand">VERDANT <span>OS</span></div>
      <div class="top-right">
        <button class="icon-button" id="search-button">⌕</button>
        <span id="clock">--:--</span>
        <button class="icon-button" id="settings-button">⚙</button>
      </div>
    </header>

    <div class="shortcuts" id="shortcuts"></div>

    <div id="windows"></div>

    <div id="start-menu" class="hidden">
      <h3>Applications</h3>
      <input id="app-search" placeholder="Search apps...">
      <div id="app-grid"></div>
    </div>

    <nav id="taskbar"></nav>
    <div id="toast" class="hidden"></div>
  </div>
</div>

<script>
(() => {
  "use strict";

  const $ = (s, root = document) => root.querySelector(s);
  const $$ = (s, root = document) => [...root.querySelectorAll(s)];

  const APPS = [
    {id:"home",name:"Welcome",icon:"⌂"},
    {id:"settings",name:"Settings",icon:"⚙"},
    {id:"files",name:"Files",icon:"▤"},
    {id:"notes",name:"Notes",icon:"▧"},
    {id:"browser",name:"Browser",icon:"◎"},
    {id:"calculator",name:"Calculator",icon:"＋"},
    {id:"gamehub",name:"Game Hub",icon:"🎮"},
    {id:"apps",name:"Installed Apps",icon:"▦"}
  ];

  const THEMES = {
    verdant: {
      bg:"#0b110c",panel:"#111912",panel2:"#19251b",
      text:"#e0e9df",muted:"#8fa08f",
      accent:"#8fbe93",border:"#2b3a2c"
    },
    midnight: {
      bg:"#0b1020",panel:"#11182a",panel2:"#1a2540",
      text:"#e7edff",muted:"#9ba8c5",
      accent:"#82aaff",border:"#303d59"
    },
    plum: {
      bg:"#130d18",panel:"#1b1321",panel2:"#291c32",
      text:"#f7efff",muted:"#b5a1bf",
      accent:"#d18cff",border:"#45334f"
    },
    slate: {
      bg:"#101419",panel:"#171e25",panel2:"#222c35",
      text:"#f0f4f8",muted:"#a0afbc",
      accent:"#b2c1d1",border:"#36434f"
    },
    light: {
      bg:"#e8eee7",panel:"#f6faf5",panel2:"#dce6da",
      text:"#26352a",muted:"#617463",
      accent:"#427a4a",border:"#bdcdbb"
    }
  };

  const DEFAULTS = {
    theme:"verdant",
    ...THEMES.verdant,
    radius:15,
    blur:20,
    fontSize:14,
    overlay:0,
    animations:true,
    square:false,
    compact:false,
    wallpaper:"",
    wallpaperData:""
  };

  let settings = {...DEFAULTS};

  try {
    settings = {
      ...settings,
      ...JSON.parse(localStorage.getItem("verdant-settings") || "{}")
    };
  } catch {}

  let zIndex = 10;
  const openWindows = new Map();

  function saveSettings() {
    localStorage.setItem("verdant-settings", JSON.stringify(settings));
    applySettings();
  }

  function applySettings() {
    const root = document.documentElement;

    for (const key of ["bg","panel","panel2","text","muted","accent","border"]) {
      root.style.setProperty("--" + key, settings[key] || DEFAULTS[key]);
    }

    root.style.setProperty("--radius", Math.max(4, Math.min(30, Number(settings.radius) || 15)) + "px");
    root.style.setProperty("--blur", Math.max(0, Math.min(40, Number(settings.blur) || 0)) + "px");
    root.style.setProperty("--font-size", Math.max(12, Math.min(20, Number(settings.fontSize) || 14)) + "px");
    root.style.setProperty("--overlay", Math.max(0, Math.min(90, Number(settings.overlay) || 0) / 100));

    document.body.classList.toggle("no-animations", !settings.animations);
    document.body.classList.toggle("square-windows", !!settings.square);
    document.body.classList.toggle("compact", !!settings.compact);

    $("#wallpaper").style.backgroundImage = settings.wallpaperData
      ? `url("${settings.wallpaperData}")`
      : settings.wallpaper
        ? `url("${settings.wallpaper}")`
        : "";

    $("#wallpaper").style.backgroundColor = settings.bg;

    $$(".window").forEach(win => {
      win.style.borderRadius = settings.square ? "3px" : "var(--radius)";
    });

    // Notify installed apps that the global theme changed.
    window.dispatchEvent(new CustomEvent("verdant-theme-change", {
      detail: {...settings}
    }));

    // Send the settings to compatible app iframes.
    $$("iframe[data-verdant-app]").forEach(frame => {
      try {
        frame.contentWindow.postMessage({
          type:"VERDANT_SETTINGS_UPDATED",
          settings:{...settings}
        }, "*");
      } catch {}
    });
  }

  function toast(message) {
    const el = $("#toast");
    el.textContent = message;
    el.classList.remove("hidden");
    clearTimeout(toast.timer);
    toast.timer = setTimeout(() => el.classList.add("hidden"), 2200);
  }

  function appById(id) {
    return APPS.find(a => a.id === id);
  }

  function renderLaunchers() {
    $("#shortcuts").innerHTML = APPS
      .filter(a => ["home","files","notes","gamehub"].includes(a.id))
      .map(a => `
        <button class="shortcut" data-launch="${a.id}">
          <span class="shortcut-icon">${a.icon}</span>
          <span>${a.name}</span>
        </button>
      `).join("");

    $("#taskbar").innerHTML = `
      <button class="task-button" data-start title="App launcher">⌘</button>
      ${APPS.filter(a => ["home","files","notes","gamehub","settings"].includes(a.id))
        .map(a => `<button class="task-button" data-launch="${a.id}" title="${a.name}">${a.icon}</button>`)
        .join("")}
    `;

    $("#app-grid").innerHTML = APPS.map(a => `
      <button class="app-tile" data-launch="${a.id}">
        <span>${a.icon}</span>${a.name}
      </button>
    `).join("");
  }

  function windowTemplate(id, title, icon, content) {
    return `
      <section class="window" data-window="${id}" style="z-index:${++zIndex}">
        <header class="titlebar">
          <div class="window-title"><span>${icon}</span>${title}</div>
          <div class="window-controls">
            <button data-minimize title="Minimize">−</button>
            <button data-maximize title="Maximize">□</button>
            <button class="close" data-close title="Close">×</button>
          </div>
        </header>
        <div class="window-body">${content}</div>
      </section>
    `;
  }

  function homeApp() {
    return `
      <h2>Welcome to Verdant OS</h2>
      <p class="muted">A workspace that adapts to you.</p>
      <div class="panel">
        <h3>Your desktop, your rules.</h3>
        <p class="muted">Open Settings to change the colors, wallpaper, glass effects, animations and window shapes throughout the OS.</p>
        <button class="primary" data-launch="settings">Personalize Verdant →</button>
      </div>
      <div class="panel">
        <h3>Installed applications</h3>
        <p class="muted">Open the app launcher to explore your built-in applications.</p>
        <button class="secondary" data-start>Open launcher</button>
      </div>
    `;
  }

  function settingsApp() {
    return `
      <h2>Personalization</h2>
      <p class="muted">Changes apply across the desktop, taskbar, menus, windows and compatible apps.</p>

      <h3>Theme presets</h3>
      <div class="theme-grid">
        ${Object.keys(THEMES).map(key => `
          <button class="theme-option ${settings.theme === key ? "selected" : ""}" data-theme="${key}">
            <div class="theme-preview">
              <span style="background:${THEMES[key].bg}"></span>
              <span style="background:${THEMES[key].panel2}"></span>
              <span style="background:${THEMES[key].accent}"></span>
            </div>
            ${key.charAt(0).toUpperCase() + key.slice(1)}
          </button>
        `).join("")}
      </div>

      <h3 style="margin-top:24px">Custom colors</h3>
      ${colorSetting("Background","bg")}
      ${colorSetting("Window color","panel")}
      ${colorSetting("Secondary panels","panel2")}
      ${colorSetting("Text","text")}
      ${colorSetting("Muted text","muted")}
      ${colorSetting("Accent","accent")}
      ${colorSetting("Borders","border")}

      <h3 style="margin-top:24px">Wallpaper</h3>
      <div class="setting-row">
        <div><strong>Image URL</strong><small>Use a direct link to an image.</small></div>
      </div>
      <div style="display:flex;gap:7px">
        <input id="wallpaper-url" placeholder="https://example.com/image.jpg" style="flex:1;width:100%">
        <button class="secondary" data-action="apply-url">Apply</button>
      </div>
      <div class="setting-row">
        <div><strong>Upload wallpaper</strong><small>Choose an image from your device.</small></div>
        <label class="secondary" style="cursor:pointer">
          Choose<input id="wallpaper-file" type="file" accept="image/*" hidden>
        </label>
      </div>
      ${rangeSetting("Wallpaper darkness","overlay",0,90,"%")}

      <h3 style="margin-top:24px">Window appearance</h3>
      ${rangeSetting("Corner roundness","radius",4,30,"px")}
      ${rangeSetting("Glass blur","blur",0,40,"px")}
      ${rangeSetting("Interface text size","fontSize",12,20,"px")}
      ${toggleSetting("Animations","animations")}
      ${toggleSetting("Square corners","square")}
      ${toggleSetting("Compact interface","compact")}

      <div class="panel">
        <h3>Reset appearance</h3>
        <p class="muted">Restore the default Verdant Green appearance.</p>
        <button class="primary" data-action="reset">Restore defaults</button>
      </div>
    `;
  }

  function colorSetting(label, key) {
    return `
      <div class="setting-row">
        <div><strong>${label}</strong></div>
        <input type="color" data-color="${key}" value="${settings[key]}">
      </div>
    `;
  }

  function rangeSetting(label, key, min, max, unit) {
    return `
      <div class="setting-row">
        <div>
          <strong>${label}</strong>
          <small>${settings[key]}${unit}</small>
        </div>
        <input type="range" data-range="${key}" min="${min}" max="${max}" value="${settings[key]}">
      </div>
    `;
  }

  function toggleSetting(label, key) {
    return `
      <div class="setting-row">
        <div><strong>${label}</strong></div>
        <button class="toggle ${settings[key] ? "on" : ""}" data-toggle="${key}">
          <span></span>
        </button>
      </div>
    `;
  }

  function filesApp() {
    return `
      <h2>File workspace</h2>
      <p class="muted">A simple local workspace for notes and HTML apps.</p>
      <div class="panel">
        <h3>Open an HTML app</h3>
        <p class="muted">Enter a URL to open a compatible app inside a window.</p>
        <input id="app-url" placeholder="https://example.com/app.html" style="width:100%">
        <button class="primary" data-action="open-url" style="margin-top:8px">Open app</button>
      </div>
      <div class="panel">
        <h3>Local storage</h3>
        <p class="muted">Settings and notes are stored in this browser.</p>
      </div>
    `;
  }

  function notesApp() {
    return `
      <h2>Notes</h2>
      <p class="muted">Your text is saved automatically on this device.</p>
      <textarea id="notes-editor" style="width:100%;height:270px;resize:vertical">${escapeHTML(localStorage.getItem("verdant-notes") || "")}</textarea>
      <button class="secondary" data-action="clear-notes" style="margin-top:8px">Clear notes</button>
    `;
  }

  function calculatorApp() {
    return `
      <h2>Calculator</h2>
      <input id="calc-input" placeholder="Example: (12 + 4) * 3" style="width:100%">
      <button class="primary" data-action="calculate" style="margin-top:8px">Calculate</button>
      <div class="panel"><strong id="calc-result">Result appears here.</strong></div>
      <p class="muted">Supports basic arithmetic and parentheses.</p>
    `;
  }

  function gamehubApp() {
    return `
      <h2>Game Hub</h2>
      <p class="muted">A small game built into your desktop.</p>
      <div class="panel" style="text-align:center">
        <div style="font-size:48px">🍃</div>
        <h3>Leaf Clicker</h3>
        <p>Leaves collected: <strong id="leaf-score">${Number(localStorage.getItem("verdant-leaves") || 0)}</strong></p>
        <button class="primary" data-action="leaf">Collect a leaf</button>
      </div>
    `;
  }

  function appsApp() {
    return `
      <h2>Installed apps</h2>
      <p class="muted">Applications available in this OS.</p>
      ${APPS.map(a => `
        <div class="setting-row">
          <div><strong>${a.icon} ${a.name}</strong></div>
          <button class="secondary" data-launch="${a.id}">Open</button>
        </div>
      `).join("")}
    `;
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    })[c]);
  }

  function openApp(id, options = {}) {
    const existing = openWindows.get(id);

    if (existing && !options.forceNew) {
      existing.classList.remove("minimized");
      existing.style.zIndex = ++zIndex;
      return;
    }

    const app = APPS.find(a => a.id === id);
    if (!app && !options.url) return;

    let title = app?.name || options.title || "External app";
    let icon = app?.icon || "▣";
    let content = "";

    if (id === "home") content = homeApp();
    else if (id === "settings") content = settingsApp();
    else if (id === "files") content = filesApp();
    else if (id === "notes") content = notesApp();
    else if (id === "calculator") content = calculatorApp();
    else if (id === "gamehub") content = gamehubApp();
    else if (id === "apps") content = appsApp();
    else if (options.url) {
      content = `
        <iframe data-verdant-app
          src="${escapeHTML(options.url)}"
          title="${escapeHTML(title)}"
          style="width:100%;height:100%;border:0;background:var(--panel)"
          sandbox="allow-scripts allow-forms allow-same-origin allow-popups"
        ></iframe>
      `;
    } else return;

    $("#windows").insertAdjacentHTML(
      "beforeend",
      windowTemplate(id, title, icon, content)
    );

    const win = $(`[data-window="${CSS.escape(id)}"]`, $("#windows"));
    win.style.zIndex = ++zIndex;
    openWindows.set(id, win);
    wireWindow(win, id);
    applySettings();
  }

  function closeApp(id) {
    const win = openWindows.get(id);
    if (win) win.remove();
    openWindows.delete(id);
  }

  function wireWindow(win, id) {
    const bar = $(".titlebar", win);

    let dragging = false;
    let startX = 0, startY = 0, initialX = 0, initialY = 0;

    bar.addEventListener("pointerdown", e => {
      if (e.target.closest("button")) return;
      if (win.classList.contains("maximized")) return;

      dragging = true;
      bar.setPointerCapture(e.pointerId);
      startX = e.clientX;
      startY = e.clientY;

      const r = win.getBoundingClientRect();
      initialX = r.left;
      initialY = r.top;

      win.style.left = initialX + "px";
      win.style.top = initialY + "px";
      win.style.transform = "none";
      win.style.zIndex = ++zIndex;
    });

    bar.addEventListener("pointermove", e => {
      if (!dragging) return;

      win.style.left = Math.max(
        -win.offsetWidth + 80,
        Math.min(innerWidth - 80, initialX + e.clientX - startX)
      ) + "px";

      win.style.top = Math.max(
        0,
        Math.min(innerHeight - 55, initialY + e.clientY - startY)
      ) + "px";
    });

    bar.addEventListener("pointerup", () => dragging = false);
    bar.addEventListener("pointercancel", () => dragging = false);

    win.addEventListener("pointerdown", () => {
      win.style.zIndex = ++zIndex;
    });

    win.addEventListener("click", e => {
      const b = e.target.closest("button");
      if (!b) return;

      if (b.hasAttribute("data-close")) {
        closeApp(id);
        return;
      }

      if (b.hasAttribute("data-minimize")) {
        win.classList.add("minimized");
        return;
      }

      if (b.hasAttribute("data-maximize")) {
        win.classList.toggle("maximized");

        if (!win.classList.contains("maximized")) {
          win.style.left = "50%";
          win.style.top = "50%";
          win.style.transform = "translate(-50%,-50%)";
        }

        return;
      }

      if (b.dataset.launch) {
        openApp(b.dataset.launch);
        return;
      }

      if (b.hasAttribute("data-start")) {
        $("#start-menu").classList.toggle("hidden");
        return;
      }

      if (b.dataset.theme) {
        const key = b.dataset.theme;
        settings.theme = key;
        Object.assign(settings, THEMES[key]);
        saveSettings();
        openApp("settings", {forceNew:true});
        return;
      }

      if (b.dataset.toggle) {
        const key = b.dataset.toggle;
        settings[key] = !settings[key];
        saveSettings();
        openApp("settings", {forceNew:true});
        return;
      }

      if (b.dataset.action) {
        handleAction(b.dataset.action, win);
      }
    });

    win.addEventListener("input", e => {
      const el = e.target;

      if (el.dataset.color) {
        settings[el.dataset.color] = el.value;
        settings.theme = "custom";
        saveSettings();
      }

      if (el.dataset.range) {
        settings[el.dataset.range] = Number(el.value);
        saveSettings();

        const small = el.closest(".setting-row")?.querySelector("small");
        if (small) {
          const unit = el.dataset.range === "radius" ||
            el.dataset.range === "blur" ||
            el.dataset.range === "fontSize" ? "px" :
            el.dataset.range === "overlay" ? "%" : "";

          small.textContent = el.value + unit;
        }
      }

      if (el.id === "notes-editor") {
        localStorage.setItem("verdant-notes", el.value);
      }

      if (el.id === "app-search") {
        const q = el.value.toLowerCase();
        $$(".app-tile", $("#app-grid")).forEach(tile => {
          tile.classList.toggle("hidden", !tile.textContent.toLowerCase().includes(q));
        });
      }
    });

    win.addEventListener("change", e => {
      if (e.target.id !== "wallpaper-file") return;

      const file = e.target.files?.[0];
      if (!file || !file.type.startsWith("image/")) return;

      if (file.size > 12 * 1024 * 1024) {
        toast("Choose an image smaller than 12 MB.");
        return;
      }

      const reader = new FileReader();

      reader.onload = () => {
        const img = new Image();

        img.onload = () => {
          const scale = Math.min(1, 1800 / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");

          canvas.width = Math.round(img.width * scale);
          canvas.height = Math.round(img.height * scale);

          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);

          settings.wallpaperData = canvas.toDataURL("image/jpeg", .84);
          settings.wallpaper = "";
          saveSettings();
          toast("Wallpaper updated.");
        };

        img.src = reader.result;
      };

      reader.readAsDataURL(file);
    });
  }

  function handleAction(action, win) {
    if (action === "apply-url") {
      const url = $("#wallpaper-url", win).value.trim();

      if (url && !/^https?:\/\//i.test(url)) {
        toast("Use a valid HTTP or HTTPS image URL.");
        return;
      }

      settings.wallpaper = url;
      settings.wallpaperData = "";
      saveSettings();
      toast("Wallpaper updated.");
    }

    if (action === "reset") {
      settings = {...DEFAULTS};
      saveSettings();
      openApp("settings", {forceNew:true});
      toast("Appearance reset.");
    }

    if (action === "clear-notes") {
      localStorage.removeItem("verdant-notes");
      openApp("notes", {forceNew:true});
    }

    if (action === "calculate") {
      const input = $("#calc-input", win).value;
      const result = $("#calc-result", win);

      // Permit only basic arithmetic characters.
      if (!/^[\d+\-*/().\s%]+$/.test(input)) {
        result.textContent = "Invalid expression.";
        return;
      }

      try {
        const value = Function('"use strict"; return (' + input + ')')();

        result.textContent = Number.isFinite(value)
          ? String(value)
          : "Invalid result.";
      } catch {
        result.textContent = "Invalid expression.";
      }
    }

    if (action === "leaf") {
      const score = Number(localStorage.getItem("verdant-leaves") || 0) + 1;
      localStorage.setItem("verdant-leaves", score);

      $("#leaf-score", win).textContent = score;
    }

    if (action === "open-url") {
      const url = $("#app-url", win).value.trim();

      try {
        const parsed = new URL(url);

        if (!["http:", "https:"].includes(parsed.protocol)) {
          throw new Error();
        }

        openApp("external-" + Date.now(), {
          url: parsed.href,
          title: parsed.hostname
        });
      } catch {
        toast("Enter a valid HTTP or HTTPS URL.");
      }
    }
  }

  // Desktop launcher interactions.
  document.addEventListener("click", e => {
    const launchButton = e.target.closest("[data-launch]");

    if (launchButton) {
      openApp(launchButton.dataset.launch);
      $("#start-menu").classList.add("hidden");
      return;
    }

    if (e.target.closest("[data-start]")) {
      $("#start-menu").classList.toggle("hidden");
    } else if (!e.target.closest("#start-menu")) {
      // Clicking elsewhere does not force-close the launcher.
    }
  });

  $("#settings-button").addEventListener("click", () => openApp("settings"));

  $("#search-button").addEventListener("click", () => {
    $("#start-menu").classList.remove("hidden");
    $("#app-search").focus();
  });

  $("#app-search").addEventListener("input", e => {
    const q = e.target.value.toLowerCase();

    $$(".app-tile").forEach(tile => {
      tile.classList.toggle("hidden", !tile.textContent.toLowerCase().includes(q));
    });
  });

  document.addEventListener("keydown", e => {
    if ((e.ctrlKey || e.metaKey) && e.code === "Space") {
      e.preventDefault();
      $("#start-menu").classList.toggle("hidden");
      $("#app-search").focus();
    }

    if (e.key === "Escape") {
      $("#start-menu").classList.add("hidden");
    }
  });

  function updateClock() {
    $("#clock").textContent = new Date().toLocaleTimeString([], {
      hour:"2-digit",
      minute:"2-digit"
    });
  }

  renderLaunchers();
  applySettings();
  updateClock();
  setInterval(updateClock, 15000);

  openApp("home");

})();
</script>
</body>
</html>
