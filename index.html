function setupPaint(win){const c=$('#paintcanvas',win);if(!c)return;const ctx=c.getContext('2d');let drawing=false,last=null;c.addEventListener('pointerdown',e=>{drawing=true;c.setPointerCapture(e.pointerId);const r=c.getBoundingClientRect();last={x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height};ctx.fillStyle=state.paintColor;ctx.beginPath();ctx.arc(last.x,last.y,4,0,Math.PI*2);ctx.fill()});c.addEventListener('pointermove',e=>{if(!drawing)return;const r=c.getBoundingClientRect(),p={x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height};ctx.strokeStyle=state.paintColor;ctx.lineWidth=Number($('#brushsize',win)?.value||7);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});const stop=()=>{drawing=false;last=null};c.addEventListener('pointerup',stop);c.addEventListener('pointercancel',stop);win.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>state.paintColor=b.dataset.color)}

function calcPress(k,win){const d=$('#calcdisplay',win||document);if(!d)return;let v=d.value;if(k==='C')v='0';else if(k==='⌫')v=v.length>1?v.slice(0,-1):'0';else if(k==='='){try{const expr=v.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[0-9+\-*/().\s]+$/.test(expr))throw 0;const n=Function('"use strict";return ('+expr+')')();v=Number.isFinite(n)?String(n):'Error'}catch{v='Error'}}else v=v==='0'||v==='Error'?k:v+k;d.value=v}

107bd52a7d"}),auth=getAuth(app),db=getDatabase(app),el=id=>document.getElementById(id),keys=["verdant-notes","verdant-editor","verdant-todos","verdant-settings"];let applying=false,listener=null;function say(s){el("va-status").textContent=s}function data(){const d={};keys.forEach(k=>{if(window.safeStorage.getItem(k)!==null)d[k]=window.safeStorage.getItem(k)});return d}async function sync(){if(!auth.currentUser||applying)return;try{await set(ref(db,"users/"+auth.currentUser.uid+"/workspace"),{data:data(),updatedAt:Date.now()});say("Cloud sync saved.")}catch(e){say("Sync failed: "+e.message+" Check database rules.")}}el("va-signin").onclick=async()=>{try{await signInWithEmailAndPassword(auth,el("va-email").value.trim(),el("va-password").value)}catch(e){say(e.message)}};el("va-signup").onclick=async()=>{try{const n=el("va-name").value.trim();if(!n)throw Error("Enter a username.");const c=await createUserWithEmailAndPassword(auth,el("va-email").value.trim(),el("va-password").value);await updateProfile(c.user,{displayName:n})}catch(e){say(e.message)}};el("va-signout").onclick=()=>signOut(auth);el("va-close").onclick=()=>el("verdant-account").style.display="none";window.verdantAccount={open:()=>el("verdant-account").style.display="grid"};onAuthStateChanged(auth,async u=>{el("va-signout").style.display=u?"inline-block":"none";if(listener){listener();listener=null}if(!u){say("Signed out. Local data stays on this device.");return}el("va-title").textContent="Signed in"+(u.displayName?" as "+u.displayName:"");try{const s=await get(ref(db,"users/"+u.uid+"/workspace/data"));if(s.exists()){applying=true;const d=s.val();keys.forEach(k=>{if(typeof d[k]==="string")window.safeStorage.setItem(k,d[k])});applying=false;say("Cloud data loaded. Reload to apply changes.")}else await sync();listener=onValue(ref(db,"users/"+u.uid+"/workspace/data"),s=>{if(!s.exists())return;applying=true;const d=s.val();keys.forEach(k=>{if(typeof d[k]==="string")window.safeStorage.setItem(k,d[k])});applying=false})}catch(e){applying=false;say("Cloud access failed: "+e.message)}});let timer;window.addEventListener("storage",()=>{clearTimeout(timer);timer=setTimeout(sync,700)});</script><script>async function checkVerdantUpdates(manual=false){const s=document.getElementById('va-update-status');if(s)s.textContent='Checking…';try{const r=await fetch('https://api.github.com/repos/BestWebBuilder123/verdant-os/commits/main',{cache:'no-store'});if(!r.ok)throw Error('GitHub '+r.status);const d=await r.json(),sha=d.sha||'',last=window.safeStorage.getItem('verdant-last-seen-commit');if(s)s.textContent='Latest commit: '+sha.slice(0,7);if(last&&last!==sha&&confirm('A newer Verdant OS commit is available. Reload?'))location.reload();window.safeStorage.setItem('verdant-last-seen-commit',sha);if(manual)alert('Update check complete: '+sha.slice(0,7)+'. The hosted page must publish new HTML for updates to appear.')}catch(e){if(s)s.textContent='Update check failed: '+e.message;if(manual)alert('Update check failed: '+e.message)}}setTimeout(()=>{if(window.safeStorage.getItem('verdant-auto-updates')!=='false')checkVerdantUpdates();setInterval(()=>{if(window.safeStorage.getItem('verdant-auto-updates')!=='false')checkVerdantUpdates()},1800000)},2500);</script></body>
