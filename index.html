<style>

.window{position:absolute;z-index:10;left:calc(50% - 290px);top:calc(50% - 230px);width:min(580px,calc(100vw - 26px));height:min(470px,calc(100dvh - 100px));min-width:280px;min-height:220px;display:flex;flex-direction:column;border:1px solid #b4d1b41c;border-radius:var(--radius);background:rgba(17,25,18,var(--glass,.94));box-shadow:0 28px 90px #0007,0 1px 0 #ffffff08 inset;backdrop-filter:blur(25px);overflow:hidden;animation:arrive calc(.22s * var(--motion)) ease-out}.window.maximized{left:12px!important;top:62px!important;width:calc(100vw - 24px)!important;height:calc(100dvh - 125px)!important;max-width:none;max-height:none}.window.minimized{display:none}.window.square{border-radius:2px}.titlebar{height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 12px 0 15px;border-bottom:1px solid #ffffff0b;background:#ffffff03;cursor:grab;user-select:none}.titlebar:active{cursor:grabbing}.titleleft{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:600}.app-symbol{display:grid;place-items:center;width:25px;height:25px;border-radius:7px;background:#213423;color:var(--accent);font-size:13px}.window-controls{display:flex;gap:5px}.window-controls button{width:24px;height:24px;display:grid;place-items:center;border:0;border-radius:7px;background:transparent;color:#8c9d8d;font-size:13px}.window-controls button:hover{background:#ffffff0e;color:white}.window-controls .close:hover{background:#633b36;color:#ffe3de}.window-body{flex:1;min-height:0;overflow:auto;padding:17px}.window-body::-webkit-scrollbar{width:7px}.window-body::-webkit-scrollbar-thumb{background:#ffffff18;border-radius:9px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:13px;border:1px solid #ffffff10;border-radius:11px;background:#ffffff04;transition:transform .2s,border-color .2s,background .2s}.card:hover{transform:translateY(-2px);border-color:#8fbe934a;background:#8fbe9309}.card-icon{display:grid;place-items:center;width:35px;height:35px;border-radius:10px;background:#1e3021;color:var(--accent);font-size:18px;margin-bottom:10px}.card h3{font-size:12px;margin:0 0 5px;font-weight:600}.card p{font-size:10px;color:var(--muted);margin:0;line-height:1.5}.primary,.secondary,.danger{border:1px solid #8fbe9338;border-radius:8px;background:#213624;color:#d8e8d8;padding:9px 12px;font-size:11px}.primary:hover{background:#2b4530}.secondary{border-color:#ffffff18;background:#ffffff07;color:#b9c9ba}.danger{border-color:#b46b603b;background:#3a211e;color:#e7c2bc}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #ffffff0b}.row:last-child{border-bottom:0}.row strong{display:block;font-size:11px;font-weight:550}.row small{display:block;margin-top:4px;font-size:10px;color:var(--muted)}.toggle{width:36px;height:20px;border:0;border-radius:20px;background:#344035;padding:3px;flex:0 0 auto}.toggle span{display:block;width:14px;height:14px;border-radius:50%;background:#91a091;transition:transform .2s}.toggle.on{background:#527b56}.toggle.on span{background:#e6f1e6;transform:translateX(16px)}input[type=range]{width:125px;accent-color:var(--accent)}input,textarea,select{color:var(--text);background:#0c130d;border:1px solid #ffffff17;border-radius:8px;padding:10px;min-width:0}textarea{width:100%;height:220px;resize:vertical;line-height:1.65;font-size:12px}input::placeholder,textarea::placeholder{color:#647565}.field{display:flex;gap:7px}.field input{flex:1;width:100%}.list{display:grid;gap:6px}.list-item{display:flex;align-items:center;gap:9px;padding:10px;border:1px solid #ffffff0d;border-radius:8px;ba .game-tabs{display:flex;gap:5px;flex-wrap:wrap;border-bottom:1px solid #ffffff12;padding-bottom:10px;margin:15px 0}.game-tabs button{border:1px solid transparent;border-radius:7px;background:transparent;color:#8fa08f;padding:7px 9px;font-size:10px}.game-tabs button.selected{background:#253729;border-color:#8fbe9330;color:#d9e9d9}.game-art{display:grid;place-items:center;min-height:88px;border-radius:8px;background:#132017;font-size:30px;margin-bottom:10px}.game-card{cursor:pointer;text-align:left}.memory-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;max-width:430px;margin:10px auto}.memory-card{min-height:55px;border:1px solid #ffffff13;border-radius:8px;background:#18271b;color:#88ad8c;font-size:22px;transition:transform .2s,background .2s}.memory-card:hover{transform:translateY(-2px)}.memory-card.open,.memory-card.matched{background:#2b4330;color:#e4eee4}.memory-card.matched{border-color:#8fbe9366}.reaction-target{width:100%;height:180px;border:1px solid #ffffff15;border-radius:12px;background:#19231a;color:#d5e3d5;font-size:16px;font-weight:600}.reaction-target.ready{background:#527d57;color:white}.leaf-clicker{display:grid;justify-items:center;gap:12px;padding:8px}.leaf-big{display:grid;place-items:center;width:125px;height:125px;border:1px solid #8fbe9345;border-radius:50%;background:#17271a;font-size:48px;animation:glow 3s ease infinite}.paint-toolbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:10px}.paint-toolbar button{width:22px;height:22px;border-radius:50%;border:2px solid #ffffff38}.paint-canvas{display:block;width:100%;height:270px;border:1px solid #ffffff15;border-radius:8px;background:#0b110c;touch-action:none}.small-muted{font-size:10px;color:var(--muted)}.clock{font:300 36px ui-monospace,monospace;letter-spacing:-.05em}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}.calendar-grid span,.calendar-grid button{padding:8px 1px;border:0;border-radius:6p body.light{--bg:#dce5dc;--panel:rgba(242,247,241,.96);--panel2:#e7eee5;--line:#c6d3c5;--text:#26352a;--muted:#667967}body.light #desktop,body.light .wallpaper{background:#dce5dc}body.light .wallpaper{background:radial-gradient(ellipse at 15% 18%,#c3d6c1,transparent 42%),radial-gradient(ellipse at 84% 82%,#c5d6c0,transparent 38%),#e2e9df}body.light .window,body.light .topbar,body.light .dock,body.light #startmenu{background:#eef4edeb;color:#26352a;border-color:#a5b9a4}body.light .window-body{color:#26352a}body.light .card,body.light .list-item{background:#dfe9de;color:#26352a}body.light input,body.light textarea{background:#f6faf5;color:#26352a}body.light .titlebar{border-color:#cad7c9}body.light .top-right,body.light .subtext,body.light .row small{color:#5e725f}

  <div class="wallpaper"><div class="contours"></div><div class="orbit"></div><div class="leaf one"></div><div class="leaf two"></div></div>

</div>
<script>window.safeStorage=(()=>{const fallback=Object.create(null);const native=()=>{try{return window.localStorage}catch{return null}};return{getItem(key){try{const s=native();if(s){const v=s.getItem(key);if(v!==null)return v}}catch{}return Object.prototype.hasOwnProperty.call(fallback,key)?fallback[key]:null},setItem(key,value){const v=String(value);fallback[key]=v;try{native()?.setItem(key,v)}catch{}},removeItem(key){delete fallback[key];try{native()?.removeItem(key)}catch{}},clear(){for(const k of Object.keys(fallback))delete fallback[k];try{native()?.clear()}catch{}}}})();</script>
<script>
(()=>{'use strict';
const apps=[

{id:'editor',name:'Text Editor',icon:'✎',desc:'Write and keep text',shortcut:false},
{id:'paint',name:'Paint Studio',icon:'❧',desc:'Draw with touch or mouse',shortcut:true},
{id:'todo',name:'To-Do List',icon:'☑',desc:'Organize your tasks',shortcut:true},
{id:'stopwatch',name:'Stopwatch',icon:'◷',desc:'Time a focus session',shortcut:false},
{id:'terminal',name:'Terminal',icon:'>_',desc:'Try built-in commands',shortcut:false},
{id:'calculator',name:'Calculator',icon:'＋',desc:'A simple calculator',shortcut:false},

{id:'music',name:'Media Player',icon:'♫',desc:'A simple audio player',shortcut:false},
{id:'reader',name:'Reader',icon:'¶',desc:'Read your saved text',shortcut:false},
{id:'tasks',name:'Task Manager',icon:'▥',desc:'See open windows',shortcut:false},

];

const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const el=$('#toast');el.textContent=msg;el.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.add('hidden'),1900)}
function setSetting(k,v){state.settings[k]=v;window.safeStorage.setItem('verdant-settings',JSON.stringify(state.settings));applySettings()}
function applySettings(){const s=state.settings;document.documentElement.style.setProperty('--accent',s.accent);document.documentElement.style.setProperty('--motion',s.motion?'1':'0');document.documentElement.style.setProperty('--glass',s.glass/100);$('#desktop').classList.toggle('still',!s.background);$('#desktop').classList.toggle('no-motion',!s.motion);document.body.classList.toggle('light',s.theme==='light');$('#windows').style.filter=`brightness(${s.brightness/100})`;$$('.window').forEach(w=>w.classList.toggle('square',s.square));}
try{const saved=JSON.parse(window.safeStorage.getItem('verdant-settings')||'{}');if(saved&&typeof saved==='object')Object.assign(state.settings,saved)}catch{};state.settings.glass=Math.max(75,Math.min(100,Number(state.settings.glass)||94));state.settings.brightness=Math.max(70,Math.min(115,Number(state.settings.brightness)||100));if(!/^#[0-9a-f]{6}$/i.test(state.settings.accent))state.settings.accent='#8fbe93';if(!['dark','light'].includes(state.settings.theme))state.settings.theme='dark'; 
function appDef(id){return apps.find(a=>a.id===id)||apps[0]}
function buildLaunchers(){const shortcuts=$('#shortcuts'),dock=$('#dock'),grid=$('#startgrid');shortcuts.innerHTML='';dock.innerHTML='<button class="dock-start" id="startbutton" title="App launcher">⌘</button><span style="width:1px;height:25px;background:#ffffff18;margin:0 3px"></span>';grid.innerHTML='';apps.filter(a=>a.shortcut).forEach(a=>shortcuts.insertAdjacentHTML('beforeend',`<button class="shortcut" data-open="${a.id}"><span class="shortcut-icon">${a.icon}</span><span>${a.name}</span></button>`));['files','browser','gamehub','notes','paint','todo','terminal','settings'].forEach(id=>{const a=appDef(id);dock.insertAdjacentHTML('beforeend',`<button data-open="${id}" title="${a.name}">${a.icon}</button>`)});apps.forEach(a=>grid.insertAdjacentHTML('beforeend',`<button class="start-app" data-open="${a.id}"><i>${a.icon}</i><span>${a.name}</span></button>`));}
function viewportBox(){const vv=window.visualViewport;return {w:Math.max(280,Math.floor(vv?.width||window.innerWidth)),h:Math.max(240,Math.floor(vv?.height||window.innerHeight)),top:Math.max(0,Math.floor(vv?.offsetTop||0))}}
function fitWindow(win){if(!win||!win.isConnected||win.classList.contains('minimized')||win.classList.contains('maximized'))return;const v=viewportBox(),mobile=v.w<=650;const margin=mobile?7:12,topMin=mobile?48:62,bottom=mobile?52:78;const width=Math.min(mobile?v.w-14:580,v.w-margin*2);const height=Math.max(200,Math.min(mobile?v.h-105:470,v.h-topMin-bottom));win.style.width=width+'px';win.style.height=height+'px';const left=Math.max(margin,Math.min(v.w-width-margin,parseFloat(win.style.left)||Math.round((v.w-width)/2)));const top=Math.max(v.top+topMin,Math.min(v.top+v.h-height-bottom,parseFloat(win.style.top)||Math.round(v.top+(v.h-height)/2)));win.style.left=left+'px';win.style.top=top+'px'}

function launchRefresh(id){const win=$(`[data-window="${id}"]`);if(!win)return;const body=win.querySelector('.window-body');body.innerHTML=renderApp(id);wireApp(win,id);applySettings();if(id==='paint')setupPaint(win);if(id==='calendar')drawCalendar(win,new Date())}
function action(act,id,win){if(act==='saveeditor'){state.editor=$('#editorarea',win).value;window.safeStorage.setItem('verdant-editor',state.editor);toast('Text saved locally')}if(act==='clearpaint'){const c=$('#paintcanvas',win);c?.getContext('2d').clearRect(0,0,c.width,c.height)}if(act==='watchtoggle'){if(state.watchRunning){state.watchRunning=false;clearInterval(state.watchInterval);state.watchInterval=null}else{state.watchRunning=true;state.watchStart=Date.now()-state.watchMs;state.watchInterval=setInterval(()=>{state.watchMs=Date.now()-state.watchStart;const f=$('#watchface',win);if(f)f.textContent=formatWatch(state.watchMs)},100)}const b=win.querySelector('[data-action="watchtoggle"]');if(b)b.textContent=state.watchRunning?'Pause':'Start'}if(act==='watchreset'){state.watchRunning=false;clearInterval(state.watchInterval);state.watchInterval=null;state.watchMs=0;const f=$('#watchface',win);if(f)f.textContent=formatWatch(0);const b=win.querySelector('[data-action="watchtoggle"]');if(b)b.textContent='Start'}if(act==='memoryreset'){resetMemory();launchRefresh('gamehub')}if(act==='reaction'){if(state.reactionState==='ready'){state.reactionResult=Math.round(performance.now()-state.reactionStart);state.reactionState='idle';launchRefresh('gamehub')}else if(state.reactionState==='wait'){clearTimeout(state.reactionTimer);state.reactionState='early';launchRefresh('gamehub')}else{state.reactionState='wait';state.reactionResult=null;launchRefresh('gamehub');state.reactionTimer=setTimeout(()=>{state.reactionState='ready';state.reactionStart=performance.now();launchRefresh('gamehub')},900+Math.random()*2200)}}if(act==='leafclick'){state.leafScore++;launchRefresh('gamehub')}if(act==='leafreset'){state.leafScore=0;launchRefresh('gamehub')}if(act==='refreshreader'){launchRefresh('reader')}if(act==='refreshapps'){launchRefresh('tasks')}if(act==='calprev'||act==='calnext'){const d=win._calDate||new Date();d.setMonth(d.getMonth()+(act==='calnext'?1:-1));drawCalendar(win,d)}if(act==='resetsettings'){state.settings={motion:true,background:true,square:false,glass:94,brightness:100,theme:'dark',accent:'#8fbe93'};window.safeStorage.setItem('verdant-settings',JSON.stringify(state.settings));launchRefresh('settings');applySettings()}}
function resetMemory(){state.memoryDeck=['🍃','🌙','🍄','🪵','🌿','🦋','🍃','🌙','🍄','🪵','🌿','🦋'].map((v,i)=>({v,id:i})).sort(()=>Math.random()-.5);state.memoryOpen=[];state.memoryMatched=[]}
function memoryFlip(i){if(state.memoryOpen.length>=2||state.memoryOpen.includes(i)||state.memoryMatched.includes(i))return;state.memoryOpen.push(i);launchRefresh('gamehub');if(state.memoryOpen.length===2){const [a,b]=state.memoryOpen;if(state.memoryDeck[a].v===state.memoryDeck[b].v){setTimeout(()=>{state.memoryMatched.push(a,b);state.memoryOpen=[];launchRefresh('gamehub')},350)}else setTimeout(()=>{state.memoryOpen=[];launchRefresh('gamehub')},800)}}
function formatWatch(ms){const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60,d=Math.floor(ms/100)%10;return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${d}`}
function saveTodos(){window.safeStorage.setItem('verdant-todos',JSON.stringify(state.todos))}
function setupPaint(win){const c=$('#paintcanvas',win);if(!c)return;const ctx=c.getContext('2d');let drawing=false,last=null;c.addEventListener('pointerdown',e=>{drawing=true;c.setPointerCapture(e.pointerId);const r=c.getBoundingClientRect();last={x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height};ctx.fillStyle=state.paintColor;ctx.beginPath();ctx.arc(last.x,last.y,4,0,Math.PI*2);ctx.fill()});c.addEventListener('pointermove',e=>{if(!drawing)return;const r=c.getBoundingClientRect(),p={x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height};ctx.strokeStyle=state.paintColor;ctx.lineWidth=Number($('#brushsize',win)?.value||7);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();last=p});const stop=()=>{drawing=false;last=null};c.addEventListener('pointerup',stop);c.addEventListener('pointercancel',stop);win.querySelectorAll('[data-color]').forEach(b=>b.onclick=()=>state.paintColor=b.dataset.color)}
function drawCalendar(win,d){win._calDate=d;const h=$('#calheading',win),g=$('#calendargrid',win);if(!h||!g)return;h.textContent=d.toLocaleDateString(undefined,{month:'long',year:'numeric'});const first=new Date(d.getFullYear(),d.getMonth(),1).getDay(),days=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(),today=new Date();g.innerHTML=['S','M','T','W','T','F','S'].map(x=>`<span class="small-muted">${x}</span>`).join('')+Array.from({length:first},()=>'<span></span>').join('')+Array.from({length:days},(_,i)=>{const n=i+1,ist=n===today.getDate()&&d.getMonth()===today.getMonth()&&d.getFullYear()===today.getFullYear();return `<button class="${ist?'today':''}" title="${n}">${n}</button>`}).join('')}
function calcPress(k,win){const d=$('#calcdisplay',win||document);if(!d)return;let v=d.value;if(k==='C')v='0';else if(k==='⌫')v=v.length>1?v.slice(0,-1):'0';else if(k==='='){try{const expr=v.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[0-9+\-*/().\s]+$/.test(expr))throw 0;const n=Function('"use strict";return ('+expr+')')();v=Number.isFinite(n)?String(n):'Error'}catch{v='Error'}}else v=v==='0'||v==='Error'?k:v+k;d.value=v}
function runTerminal(win){const input=$('#terminalinput',win),out=$('#terminalout',win),cmd=input.value.trim();let result='';const parts=cmd.split(/\s+/);if(cmd==='help')result='help · ls · pwd · date · whoami · clear · echo <text> · open <app>';else if(cmd==='ls')result='Documents  Pictures  Audio  Apps';else if(cmd==='pwd')result='/verdant/workspace';else if(cmd==='date')result=new Date().toString();else if(cmd==='whoami')result='guest@verdant';else if(cmd==='clear'){out.innerHTML='';input.value='';return}else if(parts[0]==='echo')result=cmd.slice(5);else if(parts[0]==='open'&&appDef(parts[1])){launch(parts[1]);result='Opened '+parts[1]}else result='Unknown command. Type help.';out.insertAdjacentHTML('beforeend',`<div><span style="color:#e0e9df">guest@verdant:~$ ${escapeHtml(cmd)}</span><br>${escapeHtml(result)}</div>`);out.scrollTop=out.scrollHeight;input.value=''}
buildLaunchers();applySettings();
document.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b){launch(b.dataset.open);return}if(e.target.closest('#startbutton')){$('#startmenu').classList.toggle('hidden');$('#appsearch').focus()}else if(e.target.closest('#closemenu'))$('#startmenu').classList.add('hidden');else if(!e.target.closest('#startmenu')){} });
$('#quicksettings').onclick=()=>launch('settings');$('#quicksearch').onclick=()=>{$('#startmenu').classList.remove('hidden');$('#appsearch').focus()};$('#appsearch').addEventListener('input',e=>{const q=e.target.value.toLowerCase();$$('#startgrid .start-app').forEach(b=>b.classList.toggle('hidden',!b.textContent.toLowerCase().includes(q)))});$('#topclock').textContent='';function tick(){const d=new Date();$('#topclock').textContent=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}tick();setInterval(tick,15000);
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.code==='Space'){e.preventDefault();$('#startmenu').classList.toggle('hidden');$('#appsearch').focus()}if(e.key==='Escape')$('#startmenu').classList.add('hidden');if(e.altKey&&e.key==='F4'&&state.active){e.preventDefault();closeApp(state.active)}if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==='t')launch('terminal');if(e.ctrlKey&&e.altKey&&e.key.toLowerCase()==='n')launch('notes')});
launch('gamehub');$('#startmenu').classList.add('hidden');
})();

<style>#verdant-account{position:fixed;z-index:9999;inset:0;background:#081009ee;backdrop-filter:blur(18px);display:none;place-items:center;padding:18px;color:#e0e9df;font:14px system-ui}.va-card{width:min(420px,100%);padding:24px;border:1px solid #55765a66;border-radius:18px;background:#111b13}.va-card input{display:block;width:100%;margin:9px 0;padding:12px;background:#09110b;color:#e0e9df;border:1px solid #ffffff20;border-radius:9px}.va-card button{padding:10px;border-radius:9px;background:#213624;color:#e0e9df;border:1px solid #8fbe9344}.va-card p{color:#9caf9e;font-size:12px}</style><div id="verdant-account"><div class="va-card"><button id="va-close" style="float:right">×</button><h2 id="va-title">Verdant Cloud</h2><p>Sign in to sync supported data between devices.</p><input id="va-name" placeholder="Username (new accounts)" maxlength="32"><input id="va-email" type="email" placeholder="Email"><input id="va-password" type="password" placeholder="Password (6+ characters)"><button id="va-signin">Sign in</button> <button id="va-signup">Create account</button> <button id="va-signout" style="display:none">Sign out</button><p id="va-status">Cloud sync is not connected.</p><p>Firebase Authentication and secure per-user database rules must be enabled.</p></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";import{getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged,updateProfile}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";import{getDatabase,ref,get,set,onValue}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";const app=initializeApp({apiKey:"AIzaSyABX3k9OWmoFRsRvqikjVER2K7tvWEb4YE",authDomain:"cloud-cf41f.firebaseapp.com",databaseURL:"https://cloud-cf41f-default-rtdb.firebaseio.com",projectId:"cloud-cf41f",storageBucket:"cloud-cf41f.firebasestorage.app",messagingSenderId:"703564846664",appId:"1:703564846664:web:bbef672b3284107bd52a7d"}),auth=getAuth(app),db=getDatabase(app),el=id=>document.getElementById(id),keys=["verdant-notes","verdant-editor","verdant-todos","verdant-settings"];let applying=false,listener=null;function say(s){el("va-status").textContent=s}function data(){const d={};keys.forEach(k=>{if(window.safeStorage.getItem(k)!==null)d[k]=window.safeStorage.getItem(k)});return d}async function sync(){if(!auth.currentUser||applying)return;try{await set(ref(db,"users/"+auth.currentUser.uid+"/workspace"),{data:data(),updatedAt:Date.now()});say("Cloud sync saved.")}catch(e){say("Sync failed: "+e.message+" Check database rules.")}}el("va-signin").onclick=async()=>{try{await signInWithEmailAndPassword(auth,el("va-email").value.trim(),el("va-password").value)}catch(e){say(e.message)}};el("va-signup").onclick=async()=>{try{const n=el("va-name").value.trim();if(!n)throw Error("Enter a username.");const c=await createUserWithEmailAndPassword(auth,el("va-email").value.trim(),el("va-password").value);await updateProfile(c.user,{displayName:n})}catch(e){say(e.message)}};el("va-signout").onclick=()=>signOut(auth);el("va-close").onclick=()=>el("verdant-account").style.display="none";window.verdantAccount={open:()=>el("verdant-account").style.display="grid"};onAuthStateChanged(auth,async u=>{el("va-signout").style.display=u?"inline-block":"none";if(listener){listener();listener=null}if(!u){say("Signed out. Local data stays on this device.");return}el("va-title").textContent="Signed in"+(u.displayName?" as "+u.displayName:"");try{const s=await get(ref(db,"users/"+u.uid+"/workspace/data"));if(s.exists()){applying=true;const d=s.val();keys.forEach(k=>{if(typeof d[k]==="string")window.safeStorage.setItem(k,d[k])});applying=false;say("Cloud data loaded. Reload to apply changes.")}else await sync();listener=onValue(ref(db,"users/"+u.uid+"/workspace/data"),s=>{if(!s.exists())return;applying=true;const d=s.val();keys.forEach(k=>{if(typeof d[k]==="string")window.safeStorage.setItem(k,d[k])});applying=false})}catch(e){applying=false;say("Cloud access failed: "+e.message)}});let timer;window.addEventListener("storage",()=>{clearTimeout(timer);timer=setTimeout(sync,700)});</script><script>async function checkVerdantUpdates(manual=false){const s=document.getElementById('va-update-status');if(s)s.textContent='Checking…';try{const r=await fetch('https://api.github.com/repos/BestWebBuilder123/verdant-os/commits/main',{cache:'no-store'});if(!r.ok)throw Error('GitHub '+r.status);const d=await r.json(),sha=d.sha||'',last=window.safeStorage.getItem('verdant-last-seen-commit');if(s)s.textContent='Latest commit: '+sha.slice(0,7);if(last&&last!==sha&&confirm('A newer Verdant OS commit is available. Reload?'))location.reload();window.safeStorage.setItem('verdant-last-seen-commit',sha);if(manual)alert('Update check complete: '+sha.slice(0,7)+'. The hosted page must publish new HTML for updates to appear.')}catch(e){if(s)s.textContent='Update check failed: '+e.message;if(manual)alert('Update check failed: '+e.message)}}setTimeout(()=>{if(window.safeStorage.getItem('verdant-auto-updates')!=='false')checkVerdantUpdates();setInterval(()=>{if(window.safeStorage.getItem('verdant-auto-updates')!=='false')checkVerdantUpdates()},1800000)},2500);</script></body>
