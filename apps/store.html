<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:dark;--line:#314332;--text:#e1ece0;--muted:#9aab9b}*{box-sizing:border-box}body{margin:0;padding:2px;background:transparent;color:var(--text);font:14px/1.45 system-ui,sans-serif}h1{font-size:23px;font-weight:600;letter-spacing:-.04em;margin:0 0 5px}h2{font-size:16px;margin:16px 0 8px}p{color:var(--muted);font-size:12px}button,input,textarea,select{font:inherit}button{cursor:pointer;color:var(--text);background:#213624;border:1px solid #456348;border-radius:8px;padding:9px 12px}button:hover{background:#2b4530}input,textarea,select{width:100%;padding:10px;background:#0c130d;border:1px solid var(--line);border-radius:8px;color:var(--text)}textarea{min-height:170px;resize:vertical}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}.card,.item{background:#ffffff05;border:1px solid #ffffff12;border-radius:10px;padding:12px}.muted{color:var(--muted);font-size:11px}.list{display:grid;gap:7px}.big{font:28px ui-monospace,monospace;text-align:center;padding:20px}.btn-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.btn-grid button{padding:13px 4px}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:15px}canvas{width:100%;height:250px;background:#0b110c;border:1px solid var(--line);border-radius:9px;touch-action:none}label{font-size:12px;color:var(--muted)}audio{width:100%}</style></head><body><div class="head"><div><h1>App Store</h1><p>Apps served from your GitHub repository.</p></div></div><div id="catalog" class="grid">Loading catalog…</div><p class="muted">Install enables an app in the Verdant launcher. Apps run in sandboxed iframes.</p><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function send(type,data={}){parent.postMessage({source:'verdant-app',type,...data},'*')}function save(key,value){send('storage:set',{key:'app:'+key,value})}function load(key,cb){const requestId=Math.random().toString(36).slice(2);function fn(e){if(e.data?.source==='verdant-os'&&e.data.type==='storage:value'&&e.data.requestId===requestId){removeEventListener('message',fn);cb(e.data.value)}}addEventListener('message',fn);send('storage:get',{key:'app:'+key,requestId})}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script><script>const catalog=[{id:'scientific',name:'Scientific Calculator',icon:'∑',desc:'Trig, logarithms, powers, roots and constants'},{id:'mail',name:'Mail',icon:'✉',desc:'Local inbox and saved drafts'}];load('installed-apps',v=>{const installed=Array.isArray(v)?v:[];$('#catalog').innerHTML=catalog.map(a=>'<div class="card"><h2>'+a.icon+' '+a.name+'</h2><p>'+a.desc+'</p><button data-install="'+a.id+'" '+(installed.includes(a.id)?'disabled':'')+'>'+(installed.includes(a.id)?'Installed ✓':'Install')+'</button></div>').join('');$$('[data-install]').forEach(b=>b.onclick=()=>send('install-app',{id:b.dataset.install}))});</script></body></html>
