<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:dark;--line:#314332;--text:#e1ece0;--muted:#9aab9b}*{box-sizing:border-box}body{margin:0;padding:2px;background:transparent;color:var(--text);font:14px/1.45 system-ui,sans-serif}h1{font-size:23px;font-weight:600;letter-spacing:-.04em;margin:0 0 5px}h2{font-size:16px;margin:16px 0 8px}p{color:var(--muted);font-size:12px}button,input,textarea,select{font:inherit}button{cursor:pointer;color:var(--text);background:#213624;border:1px solid #456348;border-radius:8px;padding:9px 12px}button:hover{background:#2b4530}input,textarea,select{width:100%;padding:10px;background:#0c130d;border:1px solid var(--line);border-radius:8px;color:var(--text)}textarea{min-height:170px;resize:vertical}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px}.card,.item{background:#ffffff05;border:1px solid #ffffff12;border-radius:10px;padding:12px}.muted{color:var(--muted);font-size:11px}.list{display:grid;gap:7px}.big{font:28px ui-monospace,monospace;text-align:center;padding:20px}.btn-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.btn-grid button{padding:13px 4px}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:15px}canvas{width:100%;height:250px;background:#0b110c;border:1px solid var(--line);border-radius:9px;touch-action:none}label{font-size:12px;color:var(--muted)}audio{width:100%}</style></head><body><h1>Calculator</h1><p>Trig functions use radians.</p><input id="display" value="0" style="font:24px ui-monospace,monospace;text-align:right;margin:8px 0"><div class="btn-grid"><button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button><button data-k="÷">÷</button><button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="×">×</button><button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="−">−</button><button data-k="0">0</button><button data-k=".">.</button><button data-k="C">C</button><button data-k="+">+</button><button data-k="(">(</button><button data-k=")">)</button><button data-k="⌫">⌫</button><button data-k="=">=</button></div><script>const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];function send(type,data={}){parent.postMessage({source:'verdant-app',type,...data},'*')}function save(key,value){send('storage:set',{key:'app:'+key,value})}function load(key,cb){const requestId=Math.random().toString(36).slice(2);function fn(e){if(e.data?.source==='verdant-os'&&e.data.type==='storage:value'&&e.data.requestId===requestId){removeEventListener('message',fn);cb(e.data.value)}}addEventListener('message',fn);send('storage:get',{key:'app:'+key,requestId})}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script><script>let val='0';function draw(){$('#display').value=val}$$('[data-k]').forEach(b=>b.onclick=()=>{let k=b.dataset.k;if(k==='C')val='0';else if(k==='⌫')val=val.length>1?val.slice(0,-1):'0';else if(k==='='){try{let e=val.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');if(!/^[0-9A-Za-z_.*+\-/()\s]+$/.test(e)||/(window|document|constructor|prototype|eval)/i.test(e))throw 0;let n=Function('return ('+e+')')();val=Number.isFinite(n)?String(Number(n.toPrecision(12))):'Error'}catch{val='Error'}}else val=val==='0'||val==='Error'?k:val+k;draw()});$('#display').onkeydown=e=>{if(e.key==='Enter')$('[data-k="="]').click()};</script></body></html>
